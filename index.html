<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Ari</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            padding: 0;
            background-color: #fdf6e2; /* Tonalidad baja color crema suave */
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            position: relative;
            font-family: 'Georgia', serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- CONTENEDOR INDEPENDIENTE DE YOUTUBE (INFERIOR IZQUIERDO) --- */
        #contenedor-youtube {
            position: absolute;
            bottom: 20px;
            left: 20px;
            width: 320px; /* Tamaño discreto ideal para que no tape la carta */
            height: 180px; /* Proporción limpia de pantalla */
            z-index: 30; /* Máxima prioridad para ser totalmente independiente de la carta */
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            border-radius: 12px;
            overflow: hidden;
            background: #000000;
        }
        
        /* Fuerza al iframe a estirarse y llenar su contenedor de forma correcta sin desaparecer */
        #contenedor-youtube iframe {
            width: 100% !important;
            height: 100% !important;
            border: 0 !important;
        }

        /* --- CUADRO BLANCO DE LA CARTA (CAPA INTERMEDIA) --- */
        #carta-wrapper {
            position: absolute;
            top: 45%; /* Ligeramente hacia arriba para dar espacio al video en pantallas chicas */
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 20; 
            width: 90%;
            max-width: 580px;
            background: #ffffff;
            border: 2px solid #ffb703; /* Borde amarillo girasol fuerte */
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            padding: 40px;
            border-radius: 8px;
        }

        #carta-texto {
            font-size: 1.15rem;
            line-height: 1.7;
            color: #2c2520;
            text-align: left;
            white-space: pre-line;
        }

        /* --- CONTENEDOR DE LA CASCADA MASIVA (FONDO) --- */
        .contenedor-lluvia {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Evita bloqueos lógicos en la pantalla */
            z-index: 1; /* Fondo inferior por detrás de la carta y el video */
        }

        .girasol {
            position: absolute;
            top: -65px;
            animation: caer linear infinite;
        }

        /* 22 Columnas densas de la lluvia de flores con caídas intercaladas */
        .col-1  { left: 3vw;  animation-duration: 5s;   animation-delay: 0s; }
        .col-2  { left: 12vw; animation-duration: 6.5s; animation-delay: 1.5s; }
        .col-3  { left: 22vw; animation-duration: 4.8s; animation-delay: 0.5s; }
        .col-4  { left: 32vw; animation-duration: 7s;   animation-delay: 2.2s; }
        .col-5  { left: 42vw; animation-duration: 5.5s; animation-delay: 1s; }
        .col-6  { left: 52vw; animation-duration: 6.2s; animation-delay: 3s; }
        .col-7  { left: 62vw; animation-duration: 4.5s; animation-delay: 0.8s; }
        .col-8  { left: 72vw; animation-duration: 6.8s; animation-delay: 2.5s; }
        .col-9  { left: 82vw; animation-duration: 5.2s; animation-delay: 1.2s; }
        .col-10 { left: 92vw; animation-duration: 5.8s; animation-delay: 0.3s; }
        .col-11 { left: 7vw;  animation-duration: 6s;   animation-delay: 3.5s; transform: scale(0.8); }
        .col-12 { left: 17vw; animation-duration: 4.2s; animation-delay: 2s;   transform: scale(0.85); }
        .col-13 { left: 27vw; animation-duration: 7.5s; animation-delay: 0.2s; transform: scale(0.75); }
        .col-14 { left: 37vw; animation-duration: 5.2s; animation-delay: 4.1s; transform: scale(0.85); }
        .col-15 { left: 47vw; animation-duration: 6.4s; animation-delay: 1.8s; transform: scale(0.8); }
        .col-16 { left: 57vw; animation-duration: 4.9s; animation-delay: 3.3s; transform: scale(0.9); }
        .col-17 { left: 67vw; animation-duration: 7.2s; animation-delay: 0.5s; transform: scale(0.75); }
        .col-18 { left: 77vw; animation-duration: 5.6s; animation-delay: 4.5s; transform: scale(0.85); }
        .col-19 { left: 87vw; animation-duration: 6.1s; animation-delay: 2.7s; transform: scale(0.8); }
        .col-20 { left: 45vw; animation-duration: 8.5s; animation-delay: 5s;   transform: scale(0.6); opacity: 0.8; }
        .col-21 { left: 15vw; animation-duration: 9.2s; animation-delay: 0.8s; transform: scale(0.55); opacity: 0.7; }
        .col-22 { left: 75vw; animation-duration: 8.8s; animation-delay: 3.9s; transform: scale(0.65); opacity: 0.8; }

        @keyframes caer {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            8% { opacity: 1; }
            92% { opacity: 1; }
            100% { transform: translateY(110vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- 1. VIDEO DE YOUTUBE SOLICITADO REORDENADO E INDEPENDIENTE -->
    <div id="contenedor-youtube">
        <iframe width="560" height="315" src="https://www.youtube-nocookie.com/embed/VXPgc8Enf_Y?si=-crOkwM0Koj20lgt&amp;start=1" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    </div>

    <!-- 2. RECUADRO BLANCO DE LA CARTA -->
    <div id="carta-wrapper">
        <div id="carta-texto"></div>
    </div>

    <!-- 3. LLUVIA MASIVA DE GIRASOLES -->
    <div class="contenedor-lluvia">
        <div class="girasol col-1"><svg width="52" height="52" viewBox="0 0 100 100"><path d="M50 10 Q38 32 50 50 Q62 32 50 10" fill="#ffb703"/><path d="M50 90 Q38 68 50 50 Q62 68 50 90" fill="#ffb703"/><path d="M10 50 Q32 38 50 50 Q32 62 10 50" fill="#ffb703"/><path d="M90 50 Q68 38 50 50 Q68 62 90 50" fill="#ffb703"/><path d="M22 22 Q40 40 50 50 Q30 42 22 22" fill="#fb8500"/><path d="M78 78 Q60 60 50 50 Q70 58 78 78" fill="#fb8500"/><circle cx="50" cy="50" r="18" fill="#3a1e05"/></svg></div>
        <div class="girasol col-2"><svg width="52" height="52" viewBox="0 0 100 100"><path d="M50 10 Q38 32 50 50 Q62 32 50 10" fill="#ffb703"/><path d="M50 90 Q38 68 50 50 Q62 68 50 90" fill="#ffb703"/><path d="M10 50 Q32 38 50 50 Q32 62 10 50" fill="#ffb703"/><path d="M90 50 Q68 38 50 50 Q68 62 90 50" fill="#ffb703"/><path d="M22 22 Q40 40 50 50 Q30 42 22 22" fill="#fb8500"/><path d="M78 78 Q60 60 50 50 Q70 58 78 78" fill="#fb8500"/><circle cx="50" cy="50" r="18" fill="#3a1e05"/></svg></div>
        <div class="girasol col-3"><svg width="52" height="52" viewBox="0 0 100 100"><path d="M50 10 Q38 32 50 50 Q62 32 50 10" fill="#ffb703"/><path d="M50 90 Q38 68 50 50 Q62 68 50 90" fill="#ffb703"/><path d="M10 50 Q32 38 50 50 Q32 62 10 50" fill="#ffb703"/><path d="M90 50 Q68 38 50 50 Q68 62 90 50" fill="#ffb703"/><path d="M22 22 Q40 40 50 50 Q30 42 22 22" fill="#fb8500"/><path d="M78 78 Q60 60 50 50 Q70 58 78 78" fill="#fb8500"/><circle cx="50" cy="50" r="18" fill="#3a1e05"/></svg></div>
        <div class="girasol col-4"><svg width="52" height="52" viewBox="0 0 100 100"><path d="M50 10 Q38 32 50 50 Q62 32 50 10" fill="#ffb703"/><path d="M50 90 Q38 68 50 50 Q62 68 50 90" fill="#ffb703"/><path d="M10 50 Q32 38 50 50 Q32 62 10 50" fill="#ffb703"/><path d="M90 50 Q68 38 50 50 Q68 62 90 50" fill="#ffb703"/><path d="M22 22 Q40 40 50 50 Q30 42 22 22" fill="#fb8500"/><path d="M78 78 Q60 60 50 50 Q70 58 78 78" fill="#fb8500"/><circle cx="50" cy="50" r="18" fill="#3a1e05"/></svg></div>
    </div>

    <script>
        const mensaje = `Te escribo esto porque hay cosas que no quiero que se queden en el aire y prefiero decírtelas con el corazón en la mano. Quiero empezar por pedirte perdón, sinceramente, por lo que ha pasado. \n\nSé que mis palabras o la prisa con la que manejé las cosas te pudieron haber lastimado, y lo que menos quiero en este mundo es hacerte daño.\n\nQuiero que entiendas lo mucho que te quiero. Para mí eres una persona muy importante y hermosa tanto por fuera como por todo lo lindo que eres por dentro.\n\nNo exagero cuando te digo que mi vida da vueltas en tu camino tu presencia cambia todo mi camino y valoro muchísimo todo lo que hemos compartido.`;

        const cartaTexto = document.getElementById('carta-texto');

        // Muestra el mensaje de manera directa al cargar
        window.addEventListener('DOMContentLoaded', () => {
            cartaTexto.textContent = mensaje;
        });
    </script>
</body>
</html>
